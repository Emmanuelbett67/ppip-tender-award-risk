[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-risk"
version = "1.0.0"
description = "Early-warning prediction of tender award failure in Kenyan public procurement (DSA 8401 capstone)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.6.1",
    "xgboost==3.2.0",
    "shap==0.52.0",
    "joblib==1.5.2",
    "pyarrow==19.0.0",
    "scipy==1.16.3",
    "statsmodels==0.14.6",
    "matplotlib==3.10.8",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
ui = ["streamlit==1.52.0", "plotly==6.2.0", "requests>=2.32"]
dev = ["pytest==8.4.2", "httpx==0.28.1", "tender-risk[ui]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
