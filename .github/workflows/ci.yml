name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pipeline smoke test on the committed sample extracts
        run: |
          python scripts/make_dataset.py --raw data/sample --out /tmp/sample_features.parquet
      - name: Unit, API and UI tests (against the committed model bundle)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ppip-tender-award-risk:ci .
      - name: Serve and call /predict
        run: |
          docker run -d --name api -p 8000:8000 ppip-tender-award-risk:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d @docs/example_request.json
          docker logs api
          docker rm -f api
